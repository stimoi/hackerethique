<title>Hacker éthique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: récit visuel sans texte, une scène animée plein écran par idée, navigation par points */
:root{
  color-scheme:dark;
  --bg:#0b1016; --bg2:#101822; --panel:#151f2b; --line:#24313f;
  --fg:#e6edf1; --muted:#97a6b3;
  --green:#3ddc84; --orange:#ff8a3d; --cyan:#4cc9f0; --gold:#f4d35e;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:4px;border-radius:50%}

.progress{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:4px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--cyan),var(--green));z-index:30}

.dots{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;z-index:25}
.dots a{display:block;width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);transition:transform .3s,background .3s,border-color .3s}
.dots a.cur{background:var(--green);border-color:var(--green);transform:scale(1.4)}
.dots a:hover{border-color:var(--green)}
@media (max-width:600px){.dots{gap:10px}.dots a{width:9px;height:9px}}

.scene{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));overflow:hidden;background:var(--bg)}
.scene.alt{background:var(--bg2)}
.stage{width:min(100%,1300px);max-height:86vh;height:auto;display:block;overflow:hidden}
.scene:not(.on) *{animation-play-state:paused!important}

#net{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.6}
.down{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--line);background:rgba(16,24,34,.7)}
.down svg{width:22px;height:22px;animation:bob 1.6s ease-in-out infinite}
.up{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--green);margin:0 auto;transition:transform .25s}
.up:hover{transform:translateY(-6px)}
.up svg{width:28px;height:28px}
.endwrap{display:flex;flex-direction:column;align-items:center;gap:28px;width:100%}

/* utilitaires */
.fb{transform-box:fill-box;transform-origin:center}
.eyes{transform-box:fill-box;transform-origin:center;animation:blinkeye 4.5s infinite}

/* 1 intro */
.shield-stroke{stroke-dasharray:1900;animation:draw 1.6s ease .2s backwards}
.shield-fill{animation:fadein .6s ease 1.2s backwards}
.hat{animation:drop .8s cubic-bezier(.3,1.6,.5,1) 1.3s backwards}
.shackle{animation:lockup .5s cubic-bezier(.5,0,.3,1.4) 1.9s backwards}
.lockbody{animation:fadein .5s ease 1.6s backwards}
.halo{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
.bounceL{animation:bounceL 3.2s ease-in infinite 2.4s backwards}
.bounceR{animation:bounceR 3.2s ease-in infinite 3.2s backwards}
.rip{transform-box:fill-box;transform-origin:center;opacity:0}
.ripL{animation:rip 3.2s infinite 2.4s}
.ripR{animation:rip 3.2s infinite 3.2s}

/* 2 menace */
.pk{animation:pk 6s linear infinite}
.alarm{animation:alarm 6s infinite}
.warnpop{transform-box:fill-box;transform-origin:center bottom;animation:warnpop 6s infinite}
.steal{animation:steal 6s ease-in-out infinite}
.typing{transform-box:fill-box;transform-origin:center bottom;animation:typing .35s ease-in-out infinite alternate}

/* 3 bien / mal */
.badge{transform-box:fill-box;transform-origin:center;animation:badge 7s infinite}
.jail{animation:jail 7s cubic-bezier(.5,0,.5,1) infinite}
.goodglow{transform-box:fill-box;transform-origin:center;animation:glow 7s infinite}
.jailshake{animation:jailshake 7s infinite}

/* 4 contrat */
.docin{transform-box:fill-box;transform-origin:center;animation:docin 8s cubic-bezier(.3,.8,.3,1) infinite}
.sig{stroke-dasharray:420;animation:sig 8s ease infinite}
.stampk{transform-box:fill-box;transform-origin:center;animation:stampk 8s infinite}
.keyfly{transform-box:fill-box;transform-origin:center;animation:keyfly 8s ease-in-out infinite}
.hop4{animation:hop4 8s infinite}
.flowline{stroke-dasharray:18 14;animation:flow 1s linear infinite}

/* 5 mission */
.lens{transform:translate(1030px,565px);animation:lens 8s cubic-bezier(.6,0,.3,1) infinite}
.ok1{animation:ok1 8s infinite}.ok2{animation:ok2 8s infinite}.ok3{animation:ok3 8s infinite}.ok4{animation:ok4 8s infinite}.ok5{animation:ok5 8s infinite}
.badc{animation:badc 8s infinite}
.shk{transform-box:fill-box;transform-origin:100% 100%;animation:shk 8s infinite}
.bugout{transform-box:fill-box;transform-origin:center;animation:bugout 8s infinite}
.alert{transform-box:fill-box;transform-origin:center bottom;animation:alert 8s infinite}

/* 6 méthode */
.track{transform-box:fill-box;transform-origin:0 50%;animation:track 10s cubic-bezier(.6,0,.3,1) infinite}
.st0{animation:st0 10s infinite}.st1{animation:st1 10s infinite}.st2{animation:st2 10s infinite}.st3{animation:st3 10s infinite}.st4{animation:st4 10s infinite}
.walker{animation:walk 10s cubic-bezier(.6,0,.3,1) infinite}
.sweep{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
.wig{transform-box:fill-box;transform-origin:center;animation:wig .5s ease-in-out infinite alternate}
.turn{transform-box:fill-box;transform-origin:20% 50%;animation:turn 1.2s ease-in-out infinite alternate}

/* 7 correction */
.report{animation:report 9s ease-in-out infinite}
.crack{animation:crack 9s infinite}
.bld7{animation:bld7 9s infinite}
.wr{transform-box:fill-box;transform-origin:50% 85%;animation:wr 9s infinite}
.dome{transform-box:fill-box;transform-origin:center;animation:dome 9s cubic-bezier(.3,1.4,.5,1) infinite}
.atk{animation:atk 9s ease-in infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 9s infinite}
.retreat{animation:retreat 9s infinite}
.badge7{transform-box:fill-box;transform-origin:center;animation:badge7 9s infinite}

/* 8 récompense */
.bugin{transform-box:fill-box;transform-origin:center;animation:bugin 6s ease-in infinite}
.trophyup{transform-box:fill-box;transform-origin:center bottom;animation:trophyup 6s cubic-bezier(.3,1.3,.5,1) infinite}
.shine{animation:shine 2.5s ease-in-out infinite}
.coinf{animation:coinf 6s cubic-bezier(.5,0,.6,1) infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 1.6s ease-in-out infinite}
.hop8{animation:hop8 6s infinite}

/* 9 fin */
.domedraw{stroke-dasharray:1800;animation:draw9 2.2s ease .2s backwards}
.tw{animation:tw 3s ease-in-out infinite}
.badge9{transform-box:fill-box;transform-origin:center;animation:pop 0.7s cubic-bezier(.3,1.6,.5,1) 2s backwards}
.confetti rect{animation:fall linear infinite}
.wave{transform-box:fill-box;transform-origin:20% 90%;animation:wave 1.4s ease-in-out infinite alternate}

  function onScroll(){
    var h = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = 'scaleX(' + (h > 0 ? Math.min(1, scrollY / h) : 0) + ')';
  }
  addEventListener('scroll', onScroll, {passive:true}); onScroll();

  var scenes = document.querySelectorAll('.scene');
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dots a'));
  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ e.target.classList.toggle('on', e.isIntersecting); });
    }, {threshold:0.3});
    var nio = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting) dots.forEach(function(a){ a.classList.toggle('cur', a.getAttribute('href') === '#' + e.target.id); });
      });
    }, {rootMargin:'-45% 0px -50% 0px'});
    scenes.forEach(function(s){ io.observe(s); nio.observe(s); });
  } else {
    scenes.forEach(function(s){ s.classList.add('on'); });
  }

  /* confettis de la scène finale */
  var cg = document.getElementById('confetti'), NS = 'http://www.w3.org/2000/svg';
  var cols = ['#3ddc84','#4cc9f0','#f4d35e','#e6edf1'];
  for (var i = 0; i < 36; i++){
    var r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', 60 + Math.random() * 1480);
    r.setAttribute('y', -40);
    r.setAttribute('width', 10 + Math.random() * 10);
    r.setAttribute('height', 6 + Math.random() * 8);
    r.setAttribute('rx', 2);
    r.setAttribute('fill', cols[i % cols.length]);
    r.style.transformBox = 'fill-box';
    r.style.transformOrigin = 'center';
    r.style.animationDuration = (4 + Math.random() * 4) + 's';
    r.style.animationDelay = (-Math.random() * 8) + 's';
    r.style.opacity = .75;
    cg.appendChild(r);
  }

  /* réseau animé de l'intro */
  var cv = document.getElementById('net'), ctx = cv.getContext('2d'), pts = [], W = 0, H = 0, raf = null;
  function size(){
    var b = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    W = b.width; H = b.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d,0,0,d,0,0);
    var n = Math.round(Math.min(80, W * H / 15000)); pts = [];
    for (var i = 0; i < n; i++) pts.push({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.4, vy:(Math.random()-.5)*.4});
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    for (var i = 0; i < pts.length; i++){
      var p = pts[i];
      if (!reduce){ p.x += p.vx; p.y += p.vy; }
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      for (var j = i + 1; j < pts.length; j++){
        var q = pts[j], dx = p.x - q.x, dy = p.y - q.y, d2 = dx*dx + dy*dy;
        if (d2 < 15000){
          ctx.strokeStyle = 'rgba(76,201,240,' + (0.22 * (1 - d2/15000)) + ')';
          ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
        }
      }
      ctx.fillStyle = i % 9 === 0 ? 'rgba(255,138,61,.85)' : 'rgba(61,220,132,.7)';
      ctx.beginPath(); ctx.arc(p.x, p.y, i % 9 === 0 ? 2.6 : 1.8, 0, 6.283); ctx.fill();
    }
    if (!reduce) raf = requestAnimationFrame(frame);
  }
  size(); frame();
  addEventListener('resize', function(){ size(); if (reduce) frame(); });
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ cancelAnimationFrame(raf); raf = null; }
    else if (!reduce && !raf){ frame(); }
  });
})();
</script>

</body></html>
